services:
  backend:
    build: ./backend
    container_name: pennywise-backend
    ports:
      - "8000:8000"
    volumes:
      - db-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: pennywise-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:

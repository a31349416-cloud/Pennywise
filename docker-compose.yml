version: "3.8"

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PENNYWISE_SECRET_KEY=${PENNYWISE_SECRET_KEY:-change-me-in-production}
      - PENNYWISE_DB_PATH=/app/data/pennywise.db
    volumes:
      - pennywise-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pennywise-data:

services:
  backend:
    build: ./backend
    container_name: pennywise-backend
    ports:
      - "8000:8000"
    environment:
      - PENNYWISE_DB_PATH=/data/pennywise.db
      - PENNYWISE_SECRET_KEY=${PENNYWISE_SECRET_KEY:-change-this-to-a-random-secret}
    volumes:
      - db-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: pennywise-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
